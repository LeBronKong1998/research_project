name: tests
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-cpu.lock
      - run: python -m pytest -q
        env:
          OMP_NUM_THREADS: '2'
      - run: python -m vehtraj download && python -m vehtraj smoke --device cpu
        env:
          OMP_NUM_THREADS: '2'
